# render.yaml – Blueprint de AutoMétrica para Render (Plan Gratuito)
# Este archivo debe estar ubicado en la RAÍZ de tu repositorio de GitHub.

databases:
  - name: autometrica-db
    plan: free
    region: ohio
    databaseName: autometrica
    user: autometrica

services:
  # 1. Backend (Servicio Web)
  - type: web
    name: autometrica-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: autometrica-db
          property: connectionString

  # 2. Frontend (Sitio Estático - React / Vite)
  - type: web
    name: autometrica-web
    runtime: static
    # IMPORTANTE: Los sitios estáticos en Render NO llevan región (evita el error anterior)
    rootDir: autometrica-full/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://autometrica-api.onrender.com/api/v1
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html